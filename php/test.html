<!DOCTYPE html>
<html>
<head>
    <title>SmartPonic - Test Data</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>SmartPonic - Send Test Data</h1>
    <p>Click the button to send test sensor data to the database:</p>
    <button onclick="sendTestData()">Send Test Data</button>
    <h3>Response:</h3>
    <pre id="response">Waiting...</pre>

    <script>
        async function sendTestData() {
            const testData = {
                node_id: 1,
                rssi: -45,
                snr: 10.5,
                sensors: [
                    { pin: 32, sensor: "pH", value: "2048" },
                    { pin: 33, sensor: "TDS", value: "1500" },
                    { pin: 34, sensor: "Turbidity", value: "512" },
                    { pin: 4, sensor: "DHT22", value: "28.5" },
                    { pin: 17, sensor: "Rain", value: "0" }
                ]
            };

            try {
                const response = await fetch('http://localhost/smartponic/receive_data.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                const result = await response.json();
                document.getElementById('response').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
